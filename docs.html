<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REGAL Model — Documentation</title>
<script>try{var t=null;try{t=localStorage.getItem("regal-theme");}catch(e){}if(t!=="light"&&t!=="dark"){try{t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}catch(e){t="light";}}document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
  /* Theme values live in exactly these two blocks — see the head script and the mqlDark
     "change" listener below, which always stamp data-theme="light"|"dark" on <html> (resolving
     the system preference themselves when no override is stored), so no base :root{} defaults
     or @media(prefers-color-scheme) block is needed here. */
  :root[data-theme="light"]{--navy:#0b2545;--teal:#197278;--red:#9e2b25;--orange:#e8910b;--grey:#6b6f72;
    --bg:#f4f6f8;--card:#fff;--line:#e3e7ec;--ink:#1c2530;--muted:#6b7280;
    --surface2:#fafbfc;--code-bg:#eef1f4;--th-bg:#f7f9fb;--quote-ink:#445;
    --bar-ink:#cfe0ff;--shadow:0 1px 2px rgba(16,24,40,.04);--focus:#2a63c7;--on-fg:#fff;}
  :root[data-theme="dark"]{--navy:#82aaea;--teal:#57c6c6;--red:#eb9086;--orange:#f2b544;--grey:#9aa3ad;
    --bg:#0e1420;--card:#161d2b;--line:#2b3648;--ink:#e8ecf3;--muted:#8b96a5;
    --surface2:#1b2331;--code-bg:#1e2734;--th-bg:#1b2331;--quote-ink:#c7d0dc;
    --bar-ink:#bcd4f7;--shadow:0 1px 3px rgba(0,0,0,.5);--focus:#8fb4ef;--on-fg:#0e1420;}
  *{box-sizing:border-box}
  html{color-scheme:light dark}
  :root[data-theme="light"]{color-scheme:light}
  :root[data-theme="dark"]{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    transition:background .15s,color .15s}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .bar{background:var(--navy);color:var(--on-fg);padding:12px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;transition:background .15s}
  .bar a{color:var(--bar-ink);text-decoration:none;font-size:13px}
  .bar a:hover{text-decoration:underline}
  .bar .t{font-weight:600;font-size:15px;margin-right:auto}
  #themeToggle{flex:none;font:inherit;font-size:12px;padding:6px 11px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:var(--on-fg);border-radius:8px;cursor:pointer;white-space:nowrap}
  #themeToggle:hover{background:rgba(255,255,255,.16)}
  .wrap{max-width:880px;margin:24px auto;padding:0 20px}
  .tabs{display:flex;gap:6px;margin-bottom:-1px;flex-wrap:wrap}
  .tab{appearance:none;border:1px solid var(--line);border-bottom:none;background:var(--code-bg);color:var(--muted);
    font:600 13.5px/1 inherit;padding:10px 18px;border-radius:10px 10px 0 0;cursor:pointer;transition:background .15s,color .15s}
  .tab:hover{color:var(--navy)}
  .tab[aria-selected="true"]{background:var(--card);color:var(--navy);box-shadow:0 -2px 0 var(--orange) inset}
  .doc{background:var(--card);border:1px solid var(--line);border-radius:0 12px 12px 12px;
    padding:28px 34px;box-shadow:var(--shadow);transition:background .15s,border-color .15s}
  @media(max-width:600px){.doc{padding:20px 18px}}
  .doc h1{color:var(--navy);font-size:26px;border-bottom:2px solid var(--line);padding-bottom:8px;margin-top:8px}
  .doc h2{color:var(--navy);font-size:20px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:34px}
  .doc h3{color:var(--navy);font-size:16px;margin-top:26px}
  .doc h4{color:var(--muted);font-size:14px;margin-top:20px}
  .doc a{color:var(--teal)}
  .doc code{background:var(--code-bg);border-radius:4px;padding:1px 5px;font-size:13px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .doc pre{background:var(--navy);color:#e6edf6;border-radius:8px;padding:14px 16px;overflow:auto;font-size:13px}
  .doc pre code{background:none;color:inherit;padding:0}
  .doc table{border-collapse:collapse;width:100%;margin:14px 0;font-size:13.5px;display:block;overflow-x:auto}
  .doc th,.doc td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
  .doc th{background:var(--th-bg);color:var(--navy)}
  .doc tr:nth-child(even) td{background:var(--surface2)}
  .doc blockquote{border-left:3px solid var(--orange);margin:14px 0;padding:4px 14px;color:var(--quote-ink);background:var(--surface2)}
  .doc hr{border:0;border-top:1px solid var(--line);margin:26px 0}
  .doc img{max-width:100%}
  .note{color:var(--muted);font-size:13px;margin:18px 0}
  footer{max-width:880px;margin:8px auto 40px;padding:0 20px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="bar">
  <span class="t">REGAL Model — Documentation</span>
  <a href="regal_explorer.html">← Interactive explorer</a>
  <a href="https://github.com/moalbaek/Regal_modeling" target="_blank" rel="noopener">GitHub repo</a>
  <a id="rawLink" href="REGAL_MODEL_DOCUMENTATION.md" target="_blank" rel="noopener">Raw Markdown</a>
  <button type="button" id="themeToggle" aria-pressed="false">🌙 Dark</button>
</div>
<div class="wrap">
  <div class="tabs" id="tabs" role="tablist" aria-label="Documentation sections"></div>
  <div id="doc" class="doc" role="tabpanel" tabindex="0"><p class="note">Loading documentation…</p></div>
</div>
<footer>
  Research/analysis tool operating entirely on public disclosures. Not investment advice.
</footer>

<!-- marked v12 vendored locally so the page is self-contained (no CDN dependency). -->
<script src="marked.min.js"></script>
<script>
"use strict";
// Two documentation views rendered from their Markdown source into tabs. The hash (#model /
// #research) deep-links a tab so it is shareable; content is fetched once and cached.
const DOCS = [
  {id: "model",    label: "Model documentation", file: "REGAL_MODEL_DOCUMENTATION.md", title: "REGAL Model — Documentation"},
  {id: "research", label: "BAT research basis",  file: "BAT_CONTROL_ARM_RESEARCH.md",  title: "REGAL Model — BAT research basis"},
];
const el = document.getElementById("doc");
const tabsEl = document.getElementById("tabs");
const rawLink = document.getElementById("rawLink");
const cache = {};

function render(doc) {
  el.innerHTML = '<p class="note">Loading…</p>';
  const paint = md => {
    if (window.marked) {
      el.innerHTML = marked.parse(md);
    } else {                                   // marked unavailable — show raw text rather than nothing.
      el.innerHTML = "<pre></pre>";
      el.firstChild.textContent = md;
    }
    el.scrollIntoView({block: "start"});
  };
  if (cache[doc.id] !== undefined) { paint(cache[doc.id]); return; }
  fetch(doc.file)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(md => { cache[doc.id] = md; paint(md); })
    .catch(err => {
      el.innerHTML = '<p class="note">Could not load this document (' + err.message +
        '). Read it on <a href="https://github.com/moalbaek/Regal_modeling/blob/main/' + doc.file +
        '">GitHub</a> instead.</p>';
    });
}

function select(id, updateHash, focusTab) {
  const doc = DOCS.find(d => d.id === id) || DOCS[0];
  DOCS.forEach(d => {
    const b = document.getElementById("tab-" + d.id);
    const on = d.id === doc.id;
    b.setAttribute("aria-selected", String(on));
    b.tabIndex = on ? 0 : -1;
    if (on && focusTab) b.focus();
  });
  el.setAttribute("aria-labelledby", "tab-" + doc.id);
  document.title = doc.title;
  rawLink.setAttribute("href", doc.file);
  if (updateHash) history.replaceState(null, "", "#" + doc.id);
  render(doc);
}

DOCS.forEach((d, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "tab"; b.id = "tab-" + d.id; b.textContent = d.label;
  b.setAttribute("role", "tab"); b.setAttribute("aria-selected", "false");
  b.setAttribute("aria-controls", "doc"); b.tabIndex = -1;
  b.addEventListener("click", () => select(d.id, true));
  b.addEventListener("keydown", e => {
    let target;
    if (e.key === "ArrowRight") target = DOCS[(i + 1) % DOCS.length];
    else if (e.key === "ArrowLeft") target = DOCS[(i + DOCS.length - 1) % DOCS.length];
    else if (e.key === "Home") target = DOCS[0];
    else if (e.key === "End") target = DOCS[DOCS.length - 1];
    else return;
    e.preventDefault();
    select(target.id, true, true);
  });
  tabsEl.appendChild(b);
});

// respond to back/forward and manual hash edits
window.addEventListener("hashchange", () => select(location.hash.replace(/^#/, ""), false));
select(location.hash.replace(/^#/, "") || "model", false);

// ---------- theme toggle (shared with the explorer via localStorage) ----------
// data-theme is always set (see the head script) — it's the single source of truth the CSS
// palette blocks key off; JS resolves the system default once at load and again on any live
// OS theme change below, so the CSS never needs its own @media(prefers-color-scheme) copy.
const mqlDark = window.matchMedia("(prefers-color-scheme: dark)");
const curTheme = () => document.documentElement.dataset.theme || "light";
const storedTheme = () => { try { return localStorage.getItem("regal-theme"); } catch (e) { return null; } };
function paintThemeBtn() {
  const dark = curTheme() === "dark";
  const btn = document.getElementById("themeToggle");
  btn.textContent = dark ? "☀️ Light" : "🌙 Dark";
  btn.setAttribute("aria-pressed", String(dark));
}
document.getElementById("themeToggle").addEventListener("click", () => {
  const next = curTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("regal-theme", next); } catch (e) {}
  paintThemeBtn();
});
// follow OS theme flips live, but only while no manual override is stored
mqlDark.addEventListener("change", e => {
  const stored = storedTheme();
  if (stored !== "light" && stored !== "dark") document.documentElement.dataset.theme = e.matches ? "dark" : "light";
  paintThemeBtn();
});
paintThemeBtn();
</script>
</body>
</html>
