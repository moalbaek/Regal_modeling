name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: golden test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run golden regression test
        run: python -m unittest discover -s tests -v

  smoke:
    name: CLI + figure smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run the CLI engine (prints summary, writes the 9-panel figure)
        run: python regal_explorer.py
      - name: Upload the generated figure
        uses: actions/upload-artifact@v4
        with:
          name: regal_explorer_panel
          path: regal_explorer_panel.png
          if-no-files-found: error
